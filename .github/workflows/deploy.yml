name: Deploy to Netlify

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  test-build-deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test Rust workspace
        run: cargo test --workspace --exclude gacha-tauri

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # `npm --prefix ui` only relocates package resolution; the command still runs
      # in the repository root. `npm run` scripts happen to reset cwd to the package,
      # but `npm exec` does not, so tsc looked for tsconfig.json at the root and
      # printed its help instead of type-checking. Pin the directory explicitly.
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Type-check UI
        working-directory: ui
        run: npx tsc --noEmit
      - name: Test UI
        working-directory: ui
        run: npm test

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2.85.3
        with:
          tool: wasm-pack@0.15.0
      - name: Build WebAssembly
        run: wasm-pack build crates/gacha-wasm --target web --out-dir ../../ui/public/wasm
      - name: Build production UI
        working-directory: ui
        run: npm run build
      - name: Verify WebAssembly deploy artifact
        run: |
          test -f ui/dist/wasm/gacha_wasm.js
          test -f ui/dist/wasm/gacha_wasm_bg.wasm

      - name: Verify Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"
      - name: Deploy production site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@27.0.1 deploy --dir=ui/dist --prod --message="GitHub Actions ${GITHUB_SHA}"
