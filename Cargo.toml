[workspace]
members = [
  "crates/gacha-core",
  "crates/gacha-cli",
  "crates/gacha-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
getrandom = { version = "0.2", features = ["js"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-rational = { version = "0.4", features = ["serde", "num-bigint"] }
num-traits = "0.2"
rand = "0.8"
rand_xoshiro = "0.6"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
wasm-bindgen = "0.2"

